name: render-reel
on:
  push:
    branches: [build]
    paths: ['job/**']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependensi (ffmpeg, python, playwright)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do timeout 120 sudo apt-get -o Acquire::Retries=3 -y -qq update && break || sleep 3; done
          for i in 1 2; do timeout 240 sudo apt-get -y -qq install ffmpeg && break || sleep 3; done
          pip install -q numpy scipy soundfile
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Build
        run: NODE_PATH="$PWD/node_modules" bash scripts/build.sh
      - name: Publish ke branch reel-kt
        run: |
          cd pub
          git init -q -b reel-kt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "reel from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reel-kt
